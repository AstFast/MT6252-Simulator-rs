# ---------- SIM 发送方的门（子代理 B 报告 + 我用 park 转储复核）----------
# 已证实 `[0xF021E900] = 0x24`（卡型，合法值）、`[0xF021E904] = 0xF021E908`（非空）
# ⇒ 子代理说的"缺卡型/缺通道基址"不成立。剩下的门只有一个：
# 发送方 A/C 宿主共用的 `slot+0x440`（= `[*0xF021E904]+0x440`）**唯一写者**是
# `0x080B_7290`，值取自**收到的消息** `msg[+0x12]`（`0x080B72AA: ldrh r0,[r0,#0x12]` →
# `0x080B72AC: strh r0,[r2]`）。所以要追的是"带通道号的那条收信"有没有到过。
[[patch]]
addr = 0x080B_7290
action = { kind = "count", label = "写slot+0x440(通道号)" }

