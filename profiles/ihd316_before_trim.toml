action = { kind = "log_pair", reg = "r5", reg2 = "r0", label = "扫描_到期节点" }

# 紧接着的 `ldr r0,[r5] ; cmp r0,#1` 测的是 Nucleus 的 `TM_TCB.tm_timer_type`
# （`TM_TASK_TIMER = 0`、`TM_APPL_TIMER = 1`，字段序见开源同代源码 tc_defs.h/tm_defs.h）：
# type==1 → 尾部分派 `ldr r1,[sp] ; blx r1` 调应用定时器的到期函数；
# type==0 → `0x28a6: r0=[sp,#8] ; bl 0x080039EC`（TC_Activate_Thread）唤醒任务。
# 实测这里读回 0，走的就是任务唤醒那条路，是对的。
[[patch]]
addr = 0x0800_2850
action = { kind = "log_pair", reg = "r5", reg2 = "r0", label = "扫描_节点类型" }

# 节点是嵌在 TCB 里的 `tc_timer_control`（TCB+0x78），三个字段按源码是
# +0 tm_timer_type、+4 tm_remaining_time、+8 tm_information、+0xC/+0x10 链表前后指针。
# 对任务定时器来说 tm_information **按定义就是那个 TCB**，不是谁忘了初始化。
# 实测 `[node+8] = 0xf01952d8` = L1AUDIO 的 TCB，`0x080039EC` 也确实收到它 —— 这一环是好的。
[[patch]]
addr = 0x0800_288C
action = { kind = "log_pair", reg = "r0", reg2 = "r5", label = "扫描_唤醒对象" }

# 唤醒例程入口。实测 r0 = 0xf01952d8 = L1AUDIO 的 TCB、lr = 0x080028AD（就是上面那条 bl 的返回
# 地址），说明"[node+8] 是垃圾指针"这个怀疑是错的 —— 唤醒调用是对的、参数也对。
# 注意不要在 `0x28a6`（`ldr r0,[sp,#8]` 这一句本身）挂读 r0 的探针：那时装载还没发生，
# 读到的 r0 是上一个循环留下的 0x4000B24C，会把人带偏。
[[patch]]
