# 而 **[0xF015F17E] 需要 ==1，实测整次开机只被 0x08123392 写过一次 0** —— 基线档下卡在这。
[[patch]]
addr = 0x081A_162E
action = { kind = "count", label = "C1XX 重挂" }

# ---------- 内核定时器链条计数（任务 #12）----------
# 静态读码读出来的真身（SRAM 镜像 = ROM 地址 + 0x3790_4404，由 `0x087060D4 ↔ 0x4000A4D8` 定死）：
#   NU_Increment_Clock  0x4000A4D8：[AD20]++；然后 **只有 [AD2C]==0 才** [AD28]--，
#                        减到 0 才走 0x4000A518 把 [AD2C] 置 2
#   0x4000A560：尾部判据 `[AD2C]==2 || [AD38]==2` 才继续，否则直接 bx lr
#   0x4000A578：取 0x4000AD3C 交给 0x4000A108（"挂到就绪表"例程）
#   0x4000A108：只写 obj+0x40（已在表标记）和就绪表 0x4000B228[prio]/0x4000B21C[prio]/[B234]，
#               优先级取 obj+0x1A —— **它一个字节都不碰 obj+0x00**
#   0x08001A46：系统中断任务的入口，第一句 `ldr r0,[r0] ; cmp r0,#2` 决定是否调超时扫描
#   0x08002800：NU_Decrement_Timeouts；扫描尾部 0x080028AE 清 [AD14]、把 [AD24] 装成头节点的
#               delta，再 `blx 0x08201AD8` → 0x4000A468 重载定时器（那句就是 [AD28]=r0;[AD2C]=0）
# 所以"扫描不跑"的候选断点从 6 个减到这几个计数器的第一个 0。
[[patch]]
addr = 0x4000_A4D8
action = { kind = "count", label = "时钟递增" }

[[patch]]
addr = 0x4000_A518
action = { kind = "count", label = "倒计时归零置2" }

[[patch]]
addr = 0x4000_A560
action = { kind = "count", label = "尾部判据" }

[[patch]]
addr = 0x4000_A578
action = { kind = "count", label = "让系统任务就绪" }

[[patch]]
addr = 0x4000_A108
action = { kind = "count", label = "挂就绪表入口" }

[[patch]]
addr = 0x4000_A138
action = { kind = "count", label = "挂就绪表_首次入表" }

[[patch]]
addr = 0x4000_A468
action = { kind = "count", label = "重载定时器" }

[[patch]]
