action = { kind = "log_pair", reg = "r0", reg2 = "lr", label = "谁在挂超时" }

# L1AUDIO 那条链自己的等待点（`0x08123458` 里 `bl 0x081C7A1E`）：r0=TCB，r1=原因码
[[patch]]
addr = 0x0812_346E
action = { kind = "log_pair", reg = "r0", reg2 = "r1", label = "L1AUDIO 的等待" }

# 超时扫描里"到期节点 → 等待对象"的那一句（`ldr r0,[r4,#0x24]`，r4 = 节点+8 的等待者）。
# 它打出来的 TCB 就是被唤醒的任务，用来判定扫描到底唤醒了谁。
[[patch]]
addr = 0x0800_2858
action = { kind = "log_pair", reg = "r4", reg2 = "r5", label = "扫描唤醒的任务" }

# 扫描读到的第一个到期节点：r5 = 节点地址（= 等待者 TCB + 0x78），r0 = 该节点的 delta。
# 与 `L1AUDIO 的等待(0xf01952d8)` 对一下就知道等的那个节点是不是它的。
[[patch]]
