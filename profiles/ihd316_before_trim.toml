[sim_stub]
# ---------- 虚拟 SIM 卡：补"没人按下发送键"这一步 ----------
# 实测到位的墙：SIM/SIM_2 都卡在**第一次**阻塞收信（timeout = −1，永不自愈），而投递机制本身是
# 好的（一次开机 80 次投递，dst_id 分布里没有 SIM 的 0x12 / SIM_2 的 0x13）。该发消息的那个
# 按 local id 派发的服务模块（`0x0804_92xx` 一族）从头到尾没被调用过。
# 做法是"调固件自己的函数"，不伪造队列内容、不伪造寄存器、不跳进函数中段。
# 方案 1（`0x081E_18A8` 消息构造器）已经试过并证明到顶：机制通（`QUEUE_Send` 80→81、
# 出现 `投递dst_id(0x12)`、`SIM第一次阻塞收信` 2→3，任务确实被叫醒），但醒后落到
# `0x0800CB18: bl 0x0801_4668`，那个分发器还要 `msg[+6]==1`、`msg[+0x151]==1`、
# `msg[+0x2C5]==0` 加一次长度校验 —— 构造器入参凑不出这张上下文。
# 顺带纠正一条我之前的错判：`SIM main` 里 `cmp r0,0x6A / beq 0x0800CB08` **不是**复位判据，
# 不相等的分支只是先调一次 `0x0823FCA8`，之后**落到同一个 0x0800CB08**。别再拿 0x6A 当依据。
enable = false
# 注入窗口是量出来的（基线 `dump/run_attr.log`）：L1AUDIO 的 5 个注册在**片 ≤2360** 已完成，
# 固件 park 发生在片 4000 之前，而 park 之后 `ctx_stack` 永远非空（固件是在 ISR 上下文里
# 走进"无任务"死循环的）⇒ 只能投在 2400~park 之间。不安静时代码会自动逐片顺延。
after_slices = 2500
# 方案 2：直接调 SIM 接口派发器。它自己会 `[[0xF0161E0C]+slot*4] → entry[0] = 0x0803_56F9`。
# 入参约定（逐条 r2 核实过 `0x080D_0EC0` 体内）：
#   r3 = 槽号键，由 `bl 0x081A_2A24` 按 `0x0851_C584` 的两项配置解析成槽 0/1；≥4 会 assert 0x10F
#   r1 必须非 0（`0x080D_0EEA: ldr r0,[sp,#8]` 在 `push{r0-r7,lr}; sub sp,4` 之后取的就是保存的 r1）
#   r0/r1/r2 会原样转交给冷复位 handler（`0x080D_0F22: add r0,sp,4 ; ldm r0,{r0,r1,r2}`）
func = 0x080D_0EC0
arg0 = 0x00
arg1 = 0x01
arg2 = 0x00
arg3 = 0x00
# 走"消息构造器"那条路时才用得上这两个（现在不用，见上面的 msg[+0x151] 那串上下文）
msg_id_slot = 0x0000_0000
msg_id = 0x00
# 实测上一版就是卡在这道守卫上：片数到 4435 也没注入 —— 固件到点已 park 在关机 `b .`，
# 之前 MSDC 完成回调占住的 callback_ctx 永远不会返回，"等安静"= 永不注入。
require_quiet = false

[l1]
# L1D 驱动的请求挂起位图（固件自己的 RAM 变量，不是寄存器）。CPU 侧只有置位的
# `orr`（flash 0x081CEECE），整份 ROM 没有清位代码 —— 真机由 L1 当总线主设备清。
pending_mask = 0x4000_C828

[keypad]
# key_pad_comm_def->keypad[72]，0xFE 表示该位置没有按键
matrix = [
    0x12, 0x49, 0x0F, 0x1A, 0x15, 0xFE, 0xFE, 0xFE,
    0x17, 0x10, 0x03, 0x02, 0x01, 0x11, 0xFE, 0xFE,
    0xFE, 0x17, 0x1B, 0x06, 0x05, 0x04, 0x0E, 0xFE,
    0xFE, 0xFE, 0x17, 0x7B, 0x09, 0x08, 0x07, 0x14,
    0xFE, 0xFE, 0xFE, 0x17, 0x7C, 0x0B, 0x00, 0x0A,
    0x16, 0xFE, 0xFE, 0xFE, 0x17, 0xFE, 0xFE, 0xFE,
    0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0x17, 0xFE, 0xFE,
    0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0x17, 0xFE,
    0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0xFE, 0x17,
]

