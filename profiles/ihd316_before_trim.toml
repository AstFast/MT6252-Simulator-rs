# 里程碑探针：L1AUDIO 任务的卡点。二分出来的链条是
#   main 0x0800_B9AC → bl 0x0800_DD1C(l1audio_init) → 0xDD6C bl 0x17DC8 ✓返回
#   → 0xDD72 bl 0x081E_72F0(r0=3) → 0x1E72FE bl 0x082D_0E4C → 0x2D0E70 bl 0x2D1B84 ✓返回
#   → 0x2D0E76 bl 0x0824_40EC(1) → 0x244106 bl 0x0810_2344(1)（当前 TCB 的 +0xC 必须是 "KSTA"）
#   → 0x10235A bl 0x0812_3458(1) → 0x12346E bl 0x081C_7A1E = **带 1 tick 超时的内核对象等待**
# 这条不响 = 任务还堵在那个等待里；响了 = 超时/投递通了，往下就是 4 个注册点。
[[patch]]
addr = 0x0800_DD76
action = { kind = "log_reg", reg = "r0", label = "L1AUDIO 过了 0x1E72F0(3) 的等待" }











