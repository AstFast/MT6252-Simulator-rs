# ---------- 键盘驱动的注册现场（2026-09-26 用 r2ghidra + capstone 解出来）----------
# `0x0800_20B8` 是键盘驱动初始化，四件事按顺序做：
#   1) `[0xF01D2838+4]` 为空就 `bl 0x0819FB6C("KBDEVT")` 建一个 OS 队列/信号量，句柄存回 +4；
#   2) `[0xF01D2838]` 为空就写魔数 `0x1234`，再 `bl 0x0819F9DC(r0=0x10, r1=0x0800_33F1)`
#      —— **物理号 16 的高优先处理**，逻辑 8 经 `line_map` 换出来正好是 16，
#      与 LISR 壳里 `[0xF016BDF8] |= 1<<16` 对得上；
#   3) `bl 0x0819F274(8, 0x0800_3405, "KBD handler")` = `IRQ_Register_LISR`（就是那个记账壳）；
#   4) 写 `KP_DEBOUNCE(+0x18)=0x200`、`[r5+C]=200`、`[r5+10]=100`，再 `bl 0x0819F328(r0=8,r1=1)` 使能。
# `0x0800_33F0` 的函数体只有一句：`0x0823F7B6(*[0xF01D2838]+4, 1, 0)`，
# 即**往 KBDEVT 句柄投递 1** —— 键盘真正的解码在等这个句柄的那个任务里，不在中断里。
# C 作者自己在 `docs/hook备份.c:153` 把这个地址注释成"按键高优先级中断"。
