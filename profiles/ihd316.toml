# ---- 更正：-34 的真正产生点（2026-09-27 第二个子代理，我核过） ----------------
# 上面 13 颗 SDerr34_* 全部钉错，原因是我的 `movs T1` 编码掩码把立即数位置写成
# `(h>>8)&0xFF`（正确是 `(h>>3)&0xFF`），于是扫出来的一批站点根本不是 -34 的产生点，
# 而"13 颗全 0 命中 ⇒ -34 是传递来的"这条结论跟着作废。正确的 4 颗在下面。
# 顺带另一条我的错误：`ldr r1,[pc,#0x374]` 的 capstone 输出**已经按 4 缩放过**，
# 我又乘了一次 4 才得到 0x082CBC40（值 0x18373556，落在代码里），真实池槽是
# 0x082CBCE0 = **0x0000AA55** —— 那是引导扇区/MBR 的签名常量，不是"扇区大小"。
# ⇒ 驱动确实是 MBR 感知的（`0x0813DA40` 比 0xAA55、走 4 个表项、`job+0x4c = 0x800`
#   实测等于分区起始 LBA），**镜像布局是对的，不要改成 super-floppy**。
[[patch]]
addr = 0x0815_BAC0
action = { kind = "count", label = "SDerr34b_815bac0" }

[[patch]]
addr = 0x082C_B99E
action = { kind = "count", label = "SDerr34b_82cb99e" }

[[patch]]
addr = 0x082D_4892
action = { kind = "count", label = "SDerr34b_82d4892" }

[[patch]]
addr = 0x082D_48A4
action = { kind = "count", label = "SDerr34b_82d48a4" }
