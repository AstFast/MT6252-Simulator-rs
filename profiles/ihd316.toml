# 【2026-09-26 实测判决】`MT6252_PROBES=PSrv站点` 一轮跑完：16 站里**只有 `0x080B0A86` 响（2 次）**，
# 9 个 BD3 站与另 6 个 BD5 站全 0；`dump/run_byte.log` 在 `0x080B0A84` 处读 `r0`（= 判别器刚读的
# `[r4,#0xa]`，A58 之后没人动过 r0）⇒ **两次都是 `0x1`**，两条记录 `r4 = 0xF01760C8 / 0xF01761D8`
# （相差 0x110）。写监视 `0xF01760D2` 抓到唯一写者是 `0x0807152E strh r5,[r0,#0xa]`，
# 而那是 `bl 0x0823FB6C` 之后填**新分配块**的字段、`r5` 就是构造器的第 3 入参 ⇒
# **`+0xA` 不是"没人排空的计数"，而是本次负载的字节长度**（代理给出三条硬证据：
# 它同时是 `adds r0,#0x14` 的分配大小、`movs r2,r5`+`adds r0,#0xe`+`blx 0x08245F48` 的 memcpy 长度、
# 并且被下一级原样复制）。构造器真入口是 **`0x08071504`**（`ff b5` = `push {r0-r7,lr}`；
# 出口 `0x08071574` = `05 b0 f0 bd`，帧 `0x24+0x4` 与 `0x14+0x14` 配平）——
# 我先前 `s 0x071508` 是从函数中段起的，前面 `25 73 22 00` 是 `+EGMR: "%s"` 字符串池。
# 它**全 ROM 只有一个调用者** `0x08048BCE`，且第 3 入参是 `ldrh r2,[r5,#0xa]` 的**纯拷贝**
# ⇒ 长度 0 不会在这条链内部产生，只能来自上游 **EGM TLV 记录流**
# （迭代器 `0x0823FD9A` 只有 6 个半字：`ldrh r2,[r0]; strh r2,[r1]; ldrh r1,[r0,#4]; adds r0,#8;
#   adds r0,r1,r0; bx lr` = `[u16 值][u16 长度][负载]` 链）。
# 而 `0x080B097A` 的四路开关确认：**长度 ∈ {0,2,3,4} 才发 0xBD3**（各自 cmd=0xE/1/2/4），
# 长度 1 落到 `0x080B09C8` **静默返回**；`0x080B0A58` 那处则是"0 → BD3 / 非 0 → BD5"。
# 实测长度 = 1 ⇒ 我们喂到的 EGM 记录是个 1 字节负载的包。
# 【为什么这条不再是主攻方向】C 参考版能出完整 UI，而它全部硬改就 10 处（`hook备份.c` 比
# `main.c` 多的 27 个 case 我逐条查过**全是 printf 探针**），**没有一处在这条 0x11/0xBD3/EGM 链上**；
# 他唯一在这一族里打桩的是兄弟闸 `0x08370220`（"开机流程全部完成"返 r0=1，画像已有）。
# ⇒ 这条链**大概率不是待机屏的必要条件**，先按"能不能画出待机屏"直接测，不再往下钻。
