# bne 0x080B0A84` → 非 0 就发 BD5。所以 `[r4+0xA] != 0` 是当前缺口，
# 而下一跳要知道 `r4` 是哪个记录（拿到地址就能用 `MT6252_WATCH` 抓谁写 `+0xA`）。
# ⇒ 判别器跳过了 `A5E`（那是没走的 BD3 分支体），钩子必须打在**走到的** `0x080B0A84`
# （`20 89 ldrh r0,[r4,8]`，r4 还有效）。函数头是 `push {r3,r4,r5,r6,r7,lr}`，
# 所以这里的 `lr` 就是"谁调用了这个发送函数"。
[[patch]]
