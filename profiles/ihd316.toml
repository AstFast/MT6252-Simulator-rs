[[patch]]
addr = 0x081BA0CC
action = { kind = "log_pair", reg = "r0", reg2 = "lr", label = "收表例程" }

[[patch]]
addr = 0x0837_0220
action = { kind = "set_reg", reg = "r0", value = 1 }
note = "直接宣布开机流程任务全部完成"

[[patch]]
addr = 0x081B_38D0
action = { kind = "log_pair", reg = "r1", reg2 = "lr", label = "l1audio_sethandler" }
note = "C 版这段共注册 5 个 handler：802fca5 805c96d 8058241 8046691 808fb85，我们只注册 805c96d（调用者 0x0802FBF6，前置字节标志 [r7,#2] 挡住重复）—— 后面 4 个注册点是分歧点"

[[patch]]
addr = 0x0808_7256
action = { kind = "log_reg", reg = "r0", label = "sim_check_status" }

[[patch]]
addr = 0x080D_2EE0
action = { kind = "log_reg", reg = "r2", label = "SIM_CMD 目标地址" }

[[patch]]
addr = 0x0819_F5B4
action = { kind = "log_str", reg = "r0", label = "kal_debug_print" }

[[patch]]
addr = 0x082D_2A22
action = { kind = "log_str_at", target = 0xF028_EDC4, label = "mr_sprintf" }

[[patch]]
addr = 0x081A_4D54
action = { kind = "log_str", reg = "r0", label = "dbg_print" }

[[patch]]
addr = 0x083D_1C28
action = { kind = "poke", target = 0xF016_6068, value = 0 }
note = "mr_mem_get：初始化时这里被置 1，真机应为 0"

[[patch]]
addr = 0x0838_90C8
action = { kind = "set_reg", reg = "r0", value = 1 }
note = "srv_charbat_get_charger_status 假装在充电"

[[patch]]
addr = 0x080E_7482
action = { kind = "copy_reg", reg = "r2", src = "r0" }
note = "过 nvram_util_caculate_checksum"

[[patch]]
addr = 0x0809_3FB2
action = { kind = "set_reg", reg = "r0", value = 1 }
note = "强制过 sub_8093FFA"

[[patch]]
addr = 0x4000_801E
action = { kind = "set_reg", reg = "r0", value = 1 }
note = "sub_87035D4 返回点，不改则落到 0xE7FE 自跳转"

[[patch]]
addr = 0x080D_2CA4
action = { kind = "poke_at_reg", reg = "r5", offset = 3, value = 0xFF, size = 1 }
note = "C 版注释：不知道在做什么"

