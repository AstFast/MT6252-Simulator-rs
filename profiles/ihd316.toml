# 共 44 个不同入口（45 个任务）

# ── C 版 `hookCodeCallBack`（`MT6252_Simulator/src/main.c:1829-1928`）核对结论：已齐，不是差在哪 ──
# 起因：`docs/img/01.png`/`03.png` 证明 C 版跑同一份固件能出完整 UI，而 Rust 版 L0 全黑，
# 于是去核对 C 版那张"命中就硬改寄存器/内存"的 switch。结论是**九处改状态的地址里有八处本画像
# 早就做了**（`0x0837_0220` R0=1 开机流程全部完成、`0x083D_1C28` 清 `[0xF0166068]`、
# `0x0838_90C8` R0=1、`0x080E_7482` R2=R0、`0x0809_3FB2` R0=1、`0x080D_2CA4` `[R5+3]=0xff`、
# `0x0822_3F66` R0=0、`0x0800_DA28` R0=0，都在本文件靠前处），所以"出图靠 C 版硬改返回值"这条
# 假设**已被实测否掉**：这些旁路全开着，画面仍然是黑的。差的东西在别处（下一步：抓 C 版自己的
# 固件日志做叙事差分 —— 我这边一整跑只有 3 条 `kal_debug_print`/`dbg_print`，C 版有一长串）。
# 唯一没做的一处是 `0x0806_01AC`/`0x0806_01EC`（C 版往 `TMDA_BASE` 写 R0，注释"暂时去不掉"）。
# 它对应 `sub_08060194`：`r4=0x41<<0x19=0x8200_0000`，目标值 `([0x8200000C]+2)&0xffff`，然后
# `while([0x82000000]!=目标)` 空等 —— 就是"等 13MHz 计数器走 2 格"。C 版必须作弊是因为**它的**
# 计数器不推进；Rust 版推进，所以不需要。实测也印证：`0x0806_01AC` 在 4436 片里命中 4889 次
# ≈ 每片 1 次，而真卡死会是每片约 3750 次（那条循环体 4 条指令 / 每片 15000 条）。
#
# 顺手记一条自测教训：上面那八处"没做"的错判，是因为我拿 `08370220` 去 grep，而画像写的是
# `0x0837_0220`（分组下划线）。**在这个画像里搜地址必须把下划线算进模式**，否则又会造出一批
# "某处没实现"的假缺口。

# ── C 版开机叙事里"我缺的第一批里程碑"（对照 `target/ref_boot.log` 的调用点）──
# 这三个点**早就有计数了**，就是 `C路线09`(`0x0803_57C2`)、`C路线10`(`0x0803_57E2`)、
# `C路线12`(`0x0808_6D74`)。实测（`run_paint2.log`、`run_lisr2.log` 两次独立跑法一致）：
# `C路线00/06/07/08` 各 1 次，而 `09/10/12` **一次都没有** —— 也就是固件从没读到 ATR、
# 从没打出 `L1usim_Reset OK` / `SIM RESET OK`。别再在这儿加同地址探针（同地址会互吞，
# 恒 0 长得和"没走到"一模一样）。
# 地址核对过：括号里 C 版日志行尾那个值就是 `bl 0x819f5b4`(`kal_debug_print`) 那条指令本身，
# 不是"调用点 ±4"，按 ±4 猜就是一个恒 0 的假阴性。

# 中断到底有没有派发到卡的那段代码：`0x0800_2E38` 是 LISR 派发器（算 `index=[INT_STATUS]&0x3F`），
# `0x080F_5EB0` 是 USIM 的 LISR 入口 —— 它是从运行时 LISR 表（`0x4000C840`，每项 12 字节
# `{物理号, 例程, 名字指针}`）的**槽 5** 读出来的，名字指针 `0x08099F90` 就是字符串 "USIM_Lisr"。
# 表里存的是 `0x080F5EB1`（Thumb 位在内），清掉低位才是真正入口。
# 两个计数一起看，就能分清"派发器没跑"和"派发到别处去了"。
# 实测（`run_lisr2.log`，片 4856）：派发器 2806 次、CTIRQ1 LISR 2804 次、**USIM_Lisr 0 次**，
# 而同一次跑里 SIM 的中断确实投出去了（`投线4 → 已投递 片=2780`）。
[[patch]]
addr = 0x0800_2E38
action = { kind = "count", label = "LISR派发器入口" }

[[patch]]
addr = 0x080F_5EB0
action = { kind = "count", label = "USIM_Lisr 入口" }

# ── GDI 前端总闸：`[0xF016AD1C]` 是不是非 0 ──
# `sub_0824786C` 有 **211 个直接调用者**（`find_bl` 实测），覆盖全部 GDI/GRL 前端，结构是
#   0x0824786E ldr r0,[0x82479ac]=0xF016AD1C ; ldrb r0,[r0] ; cmp r0,#0
#   0x08247874 bne 0x082478DE   ← **闩锁非 0：直接 pop 返回，一次 acquire 都不做**
#   0x08247876 bl 0x81E6ABC     ← 闩锁为 0 才会走到这里
# 隔壁 `sub_082478E0` 同构（非 0 就 `return 0`）。所以这面旗一旦非 0，**整个 GDI 前端静默空转**，
# 症状正好是"绘制原语一次没进、显存零写入"。
# ⚠ 这条旗早前被我列进"已排除的关机闩锁"，那是**没查过它管着多少调用点**就下的结论。
# 两个计数一比就分清：入口 > 0 而 acquire = 0 ⇒ 闩锁非 0，GDI 被整体关掉。
# 值本身用 `MT6252_DUMP=0xF016AD1C:4` 直接读。
[[patch]]
addr = 0x0824_786C
action = { kind = "count", label = "GDI前端总闸入口(211调用者)" }

[[patch]]
addr = 0x0824_7876
action = { kind = "count", label = "总闸:闩锁为0真去acquire" }

# 代理报的另外两个"该断的地方"：DC 安装器（要求 `DC+4` bit0==1，否则 assert 0x54A）
# 和 GRL 函数表 `0x0852D278` 行 7 的"取槽即调"站点。
[[patch]]
addr = 0x0824_597C
action = { kind = "count", label = "DC安装器入口" }

[[patch]]
addr = 0x0834_3490
action = { kind = "count", label = "GRL表:取槽即调(行7)" }

# ── 断点已夹到"DC 装好"与"有人调光栅"之间，这三条分清是哪一半 ──
# 实测：GDI 前端总闸入口 294 次、真去 acquire 也 294 次、`[0xF016AD1C]=0` ⇒ **前端没被关**；
# DC 安装器 `sub_0824597C` 跑了 2 次；而 `grl_blt`(`0x081FFEDC`) 与 GRL 表调用点 0 次。
# `sub_0824597C` 的体内结构（反汇编核过）：
#   0x08245980 bl 0x824786C            ; 走总闸
#   0x08245992 str r5,[0xF01D5F18,#0x18] ; 存 DC 指针
#   0x0824599E ldr r0,[r5,#4] ; lsls r0,#0x1f ; bne 0x82459AC  ; **DC+4 bit0 必须为 1**
