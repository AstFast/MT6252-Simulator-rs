#   记一笔（计数器常量 0x431+1），然后 **照样落进 0x0823FDF0 的发送路径**。
# 实测：80 次全部发送成功，其中 7 次走了"位未置"分支，且这 7 次的 msg_id 全是 0x6A。
[[patch]]
