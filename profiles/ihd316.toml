# (B) 那 117 个无限等全是 Nucleus QUEUE 收信（`0x08312BEA: bl 0x081C7A1E`，r1=4 写进 tc_status，
#     timeout 恒为 -1 ⇒ 内核根本不注册定时器，只能被 `TASK_Resume(,4)` 叫醒）。
