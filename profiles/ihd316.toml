# 路由里的这段（0x0823FDCC..FDF0）读到底了，**它不是丢弃闸门**：
#   r0 = (u16)[msg+0] = msg_id；bit = 1 << (msg_id & 0x1F)；word = [0x4000B344 + 4*(msg_id>>5)]
