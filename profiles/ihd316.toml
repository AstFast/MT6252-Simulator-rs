# 开机动画 → 待机屏：把"worker 全报到"这条链的每一跳都钉住
# 实测第一帧已出（开机动画泡泡帧，片 4000→5000 有 24.8% 字节在变 ⇒ 动画在播，不是冻住）。
#
# 【修正一处假零】原来那条 `动画完成:解阻塞task0x283A` 打在 `0x08385A50`，而反汇编显示
# `0x08385A50` 是 `[r4,#8] **!= 0**` 那一条分支；真正的解阻塞是
#   0x08385A48  bl 0x0829A5E8   (r0=0x283A, r1=sub_08352940(5), r2=0x93)
# 它在 `[r4,#8] == 0` 分支上。也就是说：只要固件走的是"正常"那条路，旧探针**必然**读 0。
# 现在两条分支各钉一个计数。
#
# 【回调开头还有一道提前返回闸】完整读过的控制流（`sub_08385A1C`，r4 = r0 = 描述符指针）：
#   0x08385A22  movs r0,0xff ; bl 0x08385AC4      ←  setter，见下
#   0x08385A26  bl 0x08390854                     ←  忙判定
#   0x08385A2A  cmp r0,#0 ; beq 0x08385A34(走尾)   ←  非 0 就**提前返回**：0x08385A2E bl 0x0836C6F4 + pop
#   `sub_08390854` 体：`r0 = (sub_08243DB8()!=0 && sub_08389094()!=0) ? 1 : 0`
#   0x08385A34  ldrb r0,[r4,#8] ; cmp r0,#0 ; bne 0x08385A4E
#   0x08385A48  bl 0x0829A5E8(0x283A, …, 0x93)     ←  真解阻塞
#
# 【2026-09-26 子代理逐字节复核，更正我先前写反的两处前提】
#   (a) `sub_083890A0` 第一条是 `0a 49 ldr r1,[pc,#0x28]` → **r1 自己取 0xF01658B2**，不是"继承调用者的垃圾"。
#       （我当时 r2 反汇编流从 0x0838909C 的字面量池上错位起步，把 `b2 58` 解成了 `ldr r2,[r6,r2]`，
#        于是漏看了这条，才误判成"参数没备料"。）
#   (b) `sub_08390854` 的**极性是"两个子判据都为 0 才返回 1"**，不是我先前写的"都非 0"：
#         r4 = (sub_08243DB8()==0)   r1 = (sub_08389094()==0)   返回 (r4 && r1)
#       配 `0x08385A2C beq 0x08385A34`（r0==0 才走尾解阻塞）⇒
#       **走尾的条件 = `[0xF01658B2]` 的 bit1==1 或 `[0xF01658B4]`!=0**。
#   `sub_08243DB8()` 实测测的是 `[0xF01658B2]` 的 **bit1**（掩码 0x0002；r0=1→bit1，r0=7→bit2，其它→assert 0x1F3）。
#   实测 dump（`dump/f01658ac_18*.bin`，四份全等）：`[0xF01658B2].u16 = 1` ⇒ bit1=0；`[0xF01658B4] = 3` ≠ 0。
#   ⇒ **判据返回 0，回调确实走尾去解阻塞 task 0x283A**。这条链不是墙；下一轮探针要看它醒来之后。
#
# `sub_08385AC4(r0)` 是 **0xF031DEA4 状态字段的 setter**（反汇编核实）：
#   strh r0,[0xF031DEA4] ；r0==1 → `strb 4,[0xF01655B6+4]`＝写 **[0xF01655BA]**；r0==0xff → 写 8
# 实测该字段 = 0x0001（不是 0xff）⇒ 有人以 1 调它。在 setter 入口钉一条 print，
# 一次就能看清"谁在什么时候把它写成几"。
#
# 【更正：+8 既有读者也有清零者，我先前"找不到任何读者"是错的】
# 第二个代理只按字面量找，读点其实走**逃逸指针**：`sub_0837B958` 在栈上现搭 40 字节描述符，
#   desc+0x20 = 0x08385A1D（完成回调，池 0x0837BA24 实测原字节 `1d 5a 38 08`）
#   desc+0x24 = **0xF031DEA4**（上下文，0x0837B9F4 `0d 94 str r4,[sp,#0x34]`）
# 再 `bl 0x08385650` 分配 588 字节（实测 `93 20 / 80 00` = `movs r0,0x93; lsls r0,#2`）+ memcpy 0x28。
# 所以 `sub_08385A1C` 的 r4 **就是** 0xF031DEA4 那块，`0x08385A34 ldrb r0,[r4,#8]` 就是唯一的 +8 读点。
# 写方有两条：`0x0837020E strb 1`（置）与 **`0x0837B9A2 strb r6(=0),[r4,#8]`（清）** —— 后者推翻了
# "`sub_083701E0` 是唯一写者"。
#
# 【`sub_083701E0` 的来路：它没有 BL 调用者，只被开机进度引擎按表调用】
# 主表 @0x086E1288 十条 `{u32 模块id, u32 handler, u32 子描述符}`，实测：
#   {2,...,0x086E1318} {6,0x083637CD,0} {7,...} {8,...} {9,0x0836373D,0}
#   **{0xA, 0x083647B9, 0x086E134C}** {0xE,...} {0x10,...} {0x11,0x08363865,0} {0x12,...}
# 子描述符 @0x086E134C 实测 = `{records 0x086E1328, count 3, predicate **0x083701E1**}`，
# 三条记录 = {0xB:0x0837B62D, **0xC:0x0837B959**, 0xD:0x0837B909}，而 0xC 那条的 handler 正是
# 上面写 0xF031DEA4 块的那个人。⇒ 这条 predicate 问的是"模块 0xA 的 3 个 worker 报到齐了没"。
# 它的 `sub_0837C8CC(D, 12)` 也已读通：D = `{+8 记录数组, +0C 条数, +0x1C+i 每条标志字节}`，
# 查的是 id 0xC 那条的标志字节；`r1` 结构 = `{+0 D*, +4 i16 游标 A, +6 i16 总数 B}`。
# ⇒ **置 1 有两条路**：(a) A==B；(b) A==B-1 且剩那条(id 0xC)标志为 0。
# 仍待实测：谁写 A/B（静态没定到，代理已诚实标为未排除）。
[[patch]]
