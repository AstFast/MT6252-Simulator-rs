# ── 判别器：0xBD3 与 0xBD5 是**同一个函数里二选一**发出来的 ──
# 【更正前一个代理"0xBD3 生产者不在 ROM 里"的说法】它有自己的发送者，我逐条核过：
#   0x08077EB8  a0 7a  ldrb r0,[r4,#0xa]      ← 唯一分派判据：这个字节是否为 0
#   0x08077EBA  00 28  cmp r0,#0
#   0x08077EBC  13 d1  bne 0x08077EE6         ← 非 0 → 走 0xBD5
#   0x08077EE0  93f18ef8  bl 0x0820B000       ← 为 0 → **发 0xBD3**
#   0x08077EE6  2089     ldrh r0,[r4,8]
#   0x08077EE8  73f17ef9 bl 0x081EB1E8        ← **发 0xBD5**
# 两个发送者：`sub_0820B000` 池 `0x0820B028 = d3 0b 00 00`、`sub_081EB1E8` 池
#   `0x081EB1FC = d5 0b 00 00`；两者都 src=`[*0xF02815E0]`(u16)、dest 硬编码 `0x46`，
#   分别经封装器 `0x0810443E`(local_para 0x12 字节) / `0x080D6264`(6 字节)；
#   唯一写 `ilm.msg_id` 的指令是 `0x0820991A c6 80 strh r6,[r0,#6]`，r6 是运行期实参。
# 实测 `0xBD5 ×2 / 0xBD3 ×0`，所以**最可能**是 `rec+0x0A != 0` 把控制流全送到 BD5 那边；
# 次可能是这批发送函数压根没被调到。下面 5 条一跑就能判死（钩子在指令**之前**触发，
# 所以读 `ldrb` 的结果要打在它的下一条 `0x08077EBA`）。
