# ---------- SIM 任务为什么进不到派发点（实测：`SIM回调派发blx` = 0，而 QUEUE_Send = 80）----------
# SIM main `0x0800_CAC0` 的循环是 `bl 0x0801_479C`(收信) → `cmp r0,0x6A` → …；
# 派发点在另一个函数 `0x0800_C438` 里（`0x0800_C5DE` 算索引 → `0x0800_C5F2 blx r2`）。
# 这几条计数把"收了几次信 / 走到哪个分支 / 派发函数进没进"一次分开。
[[patch]]
addr = 0x0800_CAF2
action = { kind = "count", label = "SIM收信调用" }

# 修正：SIM main `0x0800_CAC0` 的**第一条指令序列里就在阻塞收信** ——
#   0x0000CAD2 ldrb r0,[r4] ; r0 = 0x34*r0 + [0xF016B0A4] ; 0x0000CAE0 之前一句 ldr r0,[r0,#0x14]
#   （= 自己的 QUEUE 指针，算法与投递路由 0x0823FE0E 完全一致）
#   0x0000CAE0 bl 0x08239D58(r0=queue, r1=buf) → movs r3,1 → 0x081BF1EC mvns → **timeout = -1**
# 所以任务停在**第一次**收信上，挂在 CAF2 的探针永远不响。
[[patch]]
addr = 0x0800_CAE0
action = { kind = "count", label = "SIM第一次阻塞收信" }

# 80 次投递到底是投给谁的：投递路由在 0x0823FDFC 取 `msg.dst_id`（ldrh [r4,#2]），
# 再经 `[0xF015DD80 + dst_id]` 换算成任务槽。打这条就知道 SIM 槽位有没有被投递过。
[[patch]]
addr = 0x0823_FDFE
action = { kind = "log_reg", reg = "r0", label = "投递dst_id" }

# 发送者身份**打不到**：FDF2 的 `bl 0x081C_9370` 已经把 LR 覆盖成路由自己的返回地址
# （实测 lr 恒为 0x0823FDF7）。要认发送方只能挂在这段被调函数的**入口之前**或读栈上保存的
# 返回地址。这里只保留目标队列指针（r0），它已经足够判定"投给了哪个任务"。
[[patch]]
